name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Offline only: the live LLM gate needs LEDGERCHECK_LLM=1 plus an API key.
# The flag is pinned to 0 here and no key is set.
env:
  LEDGERCHECK_LLM: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the leak guard scans every commit, not just the tip

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Leak guard (no keys or local config files in any commit)
        run: python scripts/leak_guard.py --history

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Golden evals (mock judge, offline)
        run: ledgercheck judge --json judge-report.json

      - name: Upload judge report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: judge-report
          path: judge-report.json
          if-no-files-found: warn
